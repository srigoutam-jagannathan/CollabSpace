# Supabase local development configuration
# Docs: https://supabase.com/docs/guides/cli/config

[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
port = 54323

[inbucket]
port = 54324

[storage]
file_size_limit = "50MiB"

[auth]
site_url = "exp://localhost:8081"
additional_redirect_urls = ["collabspace://auth/callback", "exp://localhost:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.external.azure]
enabled = true
# Fill these in from your Azure AD app registration
client_id = "placeholder"
secret = "placeholder"
url = "https://login.microsoftonline.com/common/v2.0"
